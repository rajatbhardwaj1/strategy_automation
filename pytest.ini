[pytest]
# Only this project's tests. Without it, collection also picks up the vendored
# ShoonyaApi-py suite, which errors out on import.
testpaths = test

# Tests touching the real broker or the network are opt-in. "live" ones in
# particular can PLACE REAL ORDERS on a configured account, so a bare `pytest`
# must never run them - deselect by default and require -m live to opt in.
markers =
    live: hits the real broker with the credentials in src/config.yaml; can place real orders
    network: needs external network (yfinance, Telegram); slow, with per-symbol retries
addopts = -m "not live and not network"

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
log_file = strategy.log
log_file_level = INFO
log_file_format = %(asctime)s - %(levelname)s - %(message)s
